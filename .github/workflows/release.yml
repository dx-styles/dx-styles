name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and test
        run: bun run ci

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner's bundled npm may be older.
      # Stay on npm 11: npm 12 changed `npm info --json` to emit an array, which
      # @changesets/cli (<= 2.31.0) reads as "version never published", so every push to main
      # retries the publish and fails with "cannot publish over the previously published versions".
      # sudo because npm 11 links its man pages into /usr/local/share/man, which is root-owned
      # on the hosted runners (npm 12 dropped the man pages, so npm@latest installed without it).
      - name: Update npm for trusted publishing
        run: |
          sudo npm install -g npm@11
          npm --version

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
